name: docker

# Нативные сборки amd64 и arm64 объединяются в манифесты GHCR.

on:
  push:
    branches: [main, dev]
    tags: ['v*']
    # Фильтр исключает документацию вне каталогов, копируемых в образ.
    paths-ignore:
      - '*.md'            # AGENTS, API, CHANGELOG, README, THIRD-PARTY — all top level
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false        # one image/arch failing must not cancel the others
      matrix:
        include:
          - { image: swg-panel, dockerfile: docker/Dockerfile,      arch: amd64, runner: ubuntu-24.04 }
          - { image: swg-panel, dockerfile: docker/Dockerfile,      arch: arm64, runner: ubuntu-24.04-arm }
          - { image: swg-node,  dockerfile: docker/Dockerfile.node, arch: amd64, runner: ubuntu-24.04 }
          - { image: swg-node,  dockerfile: docker/Dockerfile.node, arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # GHCR refs must be lowercase but the owner (SanityProtocol) is mixed-case — lowercase it once.
      - id: ref
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "image=${REGISTRY}/${OWNER,,}/${{ matrix.image }}" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.ref.outputs.image }}
      # Выбираем реестр, проверив индекс и манифест нужной архитектуры.
      - id: base
        shell: bash        # bash -eo pipefail: a failing inspect must fail its pipeline, not hand jq an empty input
        env:
          DOCKERFILE: ${{ matrix.dockerfile }}
          ARCH: ${{ matrix.arch }}
        run: |
          imgs=$(sed -n 's|^FROM \(--[^ ]* \)*\${BASE_REGISTRY}/\([^ ]*\).*|\2|p' "$DOCKERFILE")
          [ -n "$imgs" ] || { echo "::error::no FROM \${BASE_REGISTRY}/… line in $DOCKERFILE"; exit 1; }
          serves() {   # serves <registry>: every base image's index, and the manifest it names for linux/$ARCH
            local img d
            for img in $imgs; do
              d=$(docker buildx imagetools inspect --raw "$1/$img" | jq -r --arg a "$ARCH" \
                  'first(.manifests[]? | select(.platform.os == "linux" and .platform.architecture == $a) | .digest) // empty') || return 1
              [ -n "$d" ] && docker buildx imagetools inspect --raw "$1/${img%%:*}@$d" > /dev/null || return 1
            done
          }
          for reg in public.ecr.aws/docker/library mirror.gcr.io/library; do
            if serves "$reg"; then
              echo "registry=$reg" >> "$GITHUB_OUTPUT"
              if [ "$reg" != public.ecr.aws/docker/library ]; then
                echo "::warning::ECR Public cannot serve the base images for linux/$ARCH — built from $reg"
                echo "Base images for linux/$ARCH came from \`$reg\` (ECR Public could not serve them)." >> "$GITHUB_STEP_SUMMARY"
              fi
              exit 0
            fi
          done
          echo "::error::neither ECR Public nor mirror.gcr.io serves the base images ($(echo $imgs)) for linux/$ARCH"; exit 1
      # Build this single arch NATIVELY and push it by DIGEST only (no tag) — the merge job
      # below assembles the tagged multi-arch manifest list from all arches' digests.
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: BASE_REGISTRY=${{ steps.base.outputs.registry }}
          outputs: type=image,name=${{ steps.ref.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          # cache scoped per image+arch so the four builds never share/clobber a cache; ignore-error
          # so a flaky gha cache ('error writing layer blob') can't fail the publish.
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }},ignore-error=true
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"   # bare hex — the merge prepends @sha256:
      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.image }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: [swg-panel, swg-node]
    steps:
      # Полная история нужна для защиты образов выпусков от очистки.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: rel
        run: |
          echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"
          # tags the prune must never take: latest, every release's version tag, and every release commit's sha tag
          # (type=sha,format=short = the first 7 hex digits). Only the prune reads this, and it runs on main only.
          keep="latest,*-beta"
          # a release commit's subject is `<version> — <headline>` (the squash); older history is granular, not releases
          for h in $(git log --first-parent --format='%H %s' HEAD | awk '$2 ~ /^[0-9]+[.][0-9]+[.][0-9]+(-[a-z]+)?$/ {print $1}'); do
            keep="$keep,sha-${h:0:7}"
          done
          echo "keep=$keep" >> "$GITHUB_OUTPUT"
      # Collect this image's per-arch digests (both amd64 + arm64) into one dir.
      - uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digest-${{ matrix.image }}-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: ref
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "image=${REGISTRY}/${OWNER,,}/${{ matrix.image }}" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.ref.outputs.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.rel.outputs.version }},enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short
      - name: Create + push the multi-arch manifest list
        working-directory: /tmp/digests
        run: |
          # shellcheck disable=SC2046  # both expansions MUST word-split: the first is `-t tag -t tag …`,
          # the second one `image@sha256:<digest>` per architecture. Quoting either passes it as a single
          # argument and imagetools takes it as one malformed tag/source.
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ steps.ref.outputs.image }}@sha256:%s ' *)
      - name: Inspect
        run: docker buildx imagetools inspect ${{ steps.ref.outputs.image }}:${{ steps.meta.outputs.version }}
      # На main сохраняем latest и теги выпусков для отката.
      - name: Prune old GHCR versions (keep newest 3)
        if: github.ref == 'refs/heads/main'
        uses: dataaxiom/ghcr-cleanup-action@v1
        continue-on-error: true
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          owner: ${{ github.repository_owner }}
          packages: ${{ matrix.image }}
          keep-n-tagged: 3
          exclude-tags: ${{ steps.rel.outputs.keep }}
          delete-untagged: true
          delete-partial-images: true
